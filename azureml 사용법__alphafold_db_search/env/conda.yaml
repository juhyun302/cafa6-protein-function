name: alphafold-download-env
channels:
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.10
  
  # Utilities
  - pip
  
  # Pip packages
  - pip:
    # Progress Bar
    - tqdm>=4.62.0

    # Async I/O
    - aiohttp>=3.8.0
    
    # Azure ML logging (Optional but good for tracking runs)
    - mlflow>=2.0.0
    - azureml-mlflow>=1.50.0
